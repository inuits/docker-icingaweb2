name: Build

on:
  schedule:
    - cron: '0 0 * * SUN' # Runs every Sunday at 00:00 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: 'Icinga Web 2 ref to build: commit hash, tag (e.g. v2.13.1) or branch (e.g. main, support/2.13)'
        required: false
        default: main
      modules_as_of:
        description: 'Module/library versions: "commit" (latest as of the core commit date), "latest", or a date YYYY-MM-DD (latest as of the end of that day, UTC)'
        required: false
        default: commit

jobs:
  # Resolve the Icinga Web 2 ref, image tag and module date once for all platforms
  prepare:
    name: prepare
    # Pinned: ubuntu-latest is moving to Ubuntu 26; switch deliberately once verified
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image: ${{ steps.vars.outputs.IMAGE_NAME }}
      sha: ${{ steps.iw2.outputs.SHA }}
      tag: ${{ steps.iw2.outputs.TAG }}
      modules_as_of: ${{ steps.iw2.outputs.MODULES_AS_OF }}

    steps:
      # Calculate the GHCR image name
      - name: Set Image Name Variable
        id: vars
        run: |
          # GHCR requires the repository owner/name to be lowercase.
          # ${{ github.repository }} is like "Hbro/docker-icingaweb2".
          # We force it to lowercase for the GHCR path.
          IMAGE_PATH_LOWERCASE="ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=$IMAGE_PATH_LOWERCASE" >> "$GITHUB_OUTPUT"

      - name: Resolve Icinga Web 2 ref
        id: iw2
        env:
          # Scheduled runs have no inputs: build the latest main with the latest modules
          REF: ${{ inputs.ref || 'main' }}
          AS_OF_MODE: ${{ github.event_name != 'workflow_dispatch' && 'latest' || inputs.modules_as_of || 'commit' }}
        run: |
          git clone https://github.com/Icinga/icingaweb2.git
          cd icingaweb2

          SHA="$(git rev-parse --verify --quiet "${REF}^{commit}" || git rev-parse --verify --quiet "origin/${REF}^{commit}" || true)"
          if [ -z "$SHA" ]; then
            echo "::error::Ref '${REF}' not found in Icinga Web 2"
            exit 1
          fi

          if [ -z "$(git branch -r --contains "$SHA" --list 'origin/main' 'origin/support/*')" ]; then
            echo "::error::Ref '${REF}' (${SHA}) is not on main or a support/* branch"
            exit 1
          fi

          git checkout --detach "$SHA"

          if git show-ref --verify --quiet "refs/tags/${REF}"; then
            LABEL="$REF"
          else
            LABEL="$(git rev-parse --short=12 "$SHA")"
          fi
          LABEL="$(tr -c 'A-Za-z0-9_.-' '-' <<<"$LABEL" | sed 's/-$//')"
          TAG="${LABEL}-$(date -u +'%Y%m%d%H%M%S')"

          case "$AS_OF_MODE" in
            commit)
              MODULES_AS_OF="$(git show -s --format=%ct "$SHA")"
              ;;
            latest)
              MODULES_AS_OF=
              ;;
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])
              MODULES_AS_OF="$(date -u -d "${AS_OF_MODE} 23:59:59" +%s)"
              ;;
            *)
              echo "::error::modules_as_of must be 'commit', 'latest' or YYYY-MM-DD, got '${AS_OF_MODE}'"
              exit 1
              ;;
          esac

          if [ -n "$MODULES_AS_OF" ]; then
            AS_OF_DISPLAY="$(date -u -d "@${MODULES_AS_OF}" +'%d/%m/%Y %H:%M:%S UTC')"
          else
            AS_OF_DISPLAY=latest
          fi

          {
            echo "SHA=$SHA"
            echo "TAG=$TAG"
            echo "MODULES_AS_OF=$MODULES_AS_OF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "| | |"
            echo "|---|---|"
            echo "| Icinga Web 2 ref | \`${REF}\` |"
            echo "| Commit | \`${SHA}\` |"
            echo "| Image tag | \`${TAG}\` |"
            echo "| Modules as of | ${AS_OF_DISPLAY} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Build each platform on a native runner (no QEMU emulation) and push it untagged, by digest.
  # Keep the platforms in sync with platforms.txt (used for local multi-platform builds).
  build:
    name: build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # This is CRITICAL for the GITHUB_TOKEN to push to GHCR
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64/v8
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout HEAD
        uses: actions/checkout@v7

      # Full clone (no --depth / --filter): any commit must be checkable out and
      # "git archive" inside the Docker build needs all objects locally.
      - name: Icinga Web 2
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git clone https://github.com/Icinga/icingaweb2.git
          git -C icingaweb2 checkout --detach "$SHA"

      # No layer cache on purpose: every build must run "apt-get upgrade" afresh
      # to pick up the latest Debian security updates (PHP, Apache, ...).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          PLATFORMS: ${{ matrix.platform }}
          MODULES_AS_OF: ${{ needs.prepare.outputs.modules_as_of }}
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          METADATA_FILE: ${{ runner.temp }}/metadata.json
        run: |
          ./build.bash ./icingaweb2 release digest "$IMAGE"
          DIGEST="$(jq -r '."containerimage.digest"' "$METADATA_FILE")"
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-platform images into one multi-platform tag
  merge:
    name: merge
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-platform tag
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          SOURCES=()
          for DIGEST in *; do
            SOURCES+=("${IMAGE}@sha256:${DIGEST}")
          done
          docker buildx imagetools create -t "${IMAGE}:${TAG}" "${SOURCES[@]}"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
          echo "Pushed \`${IMAGE}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
